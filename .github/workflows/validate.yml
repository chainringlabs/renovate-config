name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # Renovate version is pinned by hand; bump it when the preset needs a newer option.
      - name: Validate preset and repo config
        run: >
          npx --yes --ignore-scripts
          --package renovate@44.236.3 --
          renovate-config-validator --strict --no-global default.json renovate.json
